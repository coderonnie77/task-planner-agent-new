version: '3.8'

services:
  # FastAPI Backend Service
  api:
    build: .
    container_name: task-planner-api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit Frontend Service
  ui:
    build: .
    container_name: task-planner-ui
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    volumes:
      - .:/app
    command: streamlit run app_ui.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped
    depends_on:
      - api